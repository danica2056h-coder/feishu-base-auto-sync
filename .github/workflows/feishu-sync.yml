name: Feishu Sync

on:
  workflow_dispatch:
  # 后续确认固定执行时间后，可在此加入 schedule。

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node sync-feishu.js
        env:
          FEISHU_STORAGE_STATE: ${{ secrets.FEISHU_STORAGE_STATE }}
