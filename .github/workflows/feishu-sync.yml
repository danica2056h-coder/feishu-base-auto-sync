name: Feishu Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Decrypt Feishu authentication
        run: node decrypt-auth.js
        env:
          FEISHU_AUTH_KEY: ${{ secrets.FEISHU_AUTH_KEY }}
      - run: node sync-feishu.js
      - name: Clean up decrypted authentication
        if: always()
        run: rm -f playwright/.auth/feishu.json
